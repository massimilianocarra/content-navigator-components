  ### Step 9: Create Deployment Guide
  
  Always include deployment instructions:
  
  1. Build WAR: `ant -f build-war.xml` (set ICN_LIB_DIR environment variable first)
  2. Deploy WAR to WebSphere with context root `/AppName`
  3. Configure edsPlugin in ICN Admin Console:
     - Load edsPlugin.jar (provided by IBM)
     - Set URL: `https://server:port/AppName`
     - Associate with repository and desktop
  4. Restart ICN
  5. Test with curl commands
  6. Clear browser cache and test in ICN
  
  ## Common Patterns and Examples
  
  ### Loading Data from Database
  ```java
  private JSONArray loadFromDatabase(String query) throws SQLException {
      JSONArray choices = new JSONArray();
      try (Connection conn = getConnection();
           PreparedStatement stmt = conn.prepareStatement(query);
           ResultSet rs = stmt.executeQuery()) {
          while (rs.next()) {
              JSONObject choice = new JSONObject();
              choice.put("displayName", rs.getString("display_name"));
              choice.put("value", rs.getString("value"));
              choices.add(choice);
          }
      }
      return choices;
  }
  ```
  
  ### Loading Data from REST API
  ```java
  private JSONArray loadFromAPI(String apiUrl) throws IOException {
      URL url = new URL(apiUrl);
      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
      conn.setRequestMethod("GET");
      conn.setRequestProperty("Accept", "application/json");
      
      try (InputStream stream = conn.getInputStream()) {
          return JSONArray.parse(stream);
      }
  }
  ```
  
  ### Caching for Performance
  ```java
  private static Map<String, JSONArray> cache = new ConcurrentHashMap<>();
  private static final long CACHE_TTL = 3600000; // 1 hour
  
  private JSONArray loadWithCache(String key) throws IOException {
      if (cache.containsKey(key)) {
          return cache.get(key);
      }
      JSONArray data = loadInitialChoices(key);
      cache.put(key, data);
      return data;
  }
  ```
  
  ## Best Practices
  
  1. **Error Handling**: Always wrap operations in try-catch and log errors
  2. **Logging**: Use System.out.println for debugging (visible in WebSphere logs)
  3. **Performance**: Cache static data, avoid loading on every request
  4. **Security**: Validate all input, sanitize data from external sources
  5. **Testing**: Test with curl before deploying to ICN
  6. **Documentation**: Document data sources, validation rules, and dependencies
  
  ## Common Issues and Solutions

  1. **404 on /types or /type/\***: Check URL patterns in web.xml — must be exactly `/types` and `/type/*`

  2. **SRVE0303E on startup**: web.xml schema 3.0 merged with stale WebSphere config.
     Fix: use DTD 2.3 in web.xml. Also run full uninstall via wsadmin before reinstalling:
     ```python
     AdminApp.uninstall('AppName_war'); AdminConfig.save()
     ```

  3. **UnsupportedClassVersionError (bad major version 65.0, max 52.0)**:
     Classes compiled with Java 21 instead of Java 8.
     Fix: use `fork="true"` + `executable="${java8.home}/bin/javac"` in build-war.xml.
     Always verify with `od`/`hexdump` that major version = 52 before deploying.

  4. **contextRoot missing (404 after install)**:
     WebSphere Fast Path installer sometimes omits contextRoot from deployment.xml.
     Fix: edit deployment.xml manually and add `contextRoot="/AppName"` to the `<modules>` element,
     then stop/start the application.

  5. **Expecting '{' error from edsPlugin**:
     UpdateObjectTypeServlet returns array directly but this edsPlugin version expects wrapped format.
     Fix: wrap response as `{"properties": responseArray}`.

  6. **Combo boxes empty or not updating**:
     - Verify symbolic names match EXACTLY what FileNet P8 uses (check in ACCE, case-sensitive)
     - Ensure `hasDependentProperties: true` is set on parent properties

  7. **Computed field not updating in real-time**:
     - All input fields that affect the computed value must have `"hasDependentProperties": true`
     - The computed field must always appear in the EDS response (even as empty string)
     - The computed field must have `"displayMode": "readwrite"` in PropertyData.json

  8. **Date field off by one day**:
     ICN converts browser local midnight to UTC before sending. For users east of UTC (e.g. CEST),
     the UTC date is one day earlier. Fix: if UTC hour >= 12, add 1 day to get the real date.

  9. **Symbolic names wrong**: Always verify property symbolic names in ACCE
     (FileNet P8 Administration Console for Content Engine), not in ICN — they are case-sensitive
     and may differ from display names.
  
  ## Interaction Guidelines
  
  - Always ask clarifying questions about requirements before generating code
  - Provide complete, working code that follows IBM best practices
  - Include comments explaining critical sections
  - Suggest testing steps after code generation
  - Offer to create build scripts and deployment guides
  - Warn about common pitfalls specific to the implementation
  - Reference the Italian Location EDS project as a working example when helpful
  
  When a user asks to create an EDS, start by gathering requirements, then generate all necessary files in the correct structure, and finally provide testing and deployment instructions.

whenToUse: |
  Use this mode when you need to create External Data Service (EDS) plugins for IBM Content Navigator.
  
  Specific scenarios include:
  - Creating choice lists populated from external data sources (JSON, database, REST API)
  - Implementing dependent choice lists with hierarchical filtering (e.g., Country → State → City)
  - Adding regex validation to document properties
  - Implementing property prefilling based on context or business rules
  - Adding cross-property validation with custom error messages
  - Converting existing PluginService implementations to proper EDS architecture
  - Troubleshooting EDS issues (404 errors, empty combo boxes, dependencies not working)
  - Optimizing EDS performance with caching strategies
  
  This mode is ideal when working with:
  - IBM Content Navigator 3.0.7 or higher
  - FileNet P8 Content Engine
  - WebSphere Application Server 8.5 or 9.0
  - Java 8 (required — higher versions cause UnsupportedClassVersionError on WebSphere 9)

  The mode provides complete project generation including servlets, configuration files, build scripts, and deployment guides.

